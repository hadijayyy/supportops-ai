services:
  api:
    build: ./backend
    environment:
      SUPPORTOPS_DB_PATH: /app/data/supportops.db
      AUTO_REFUND_THRESHOLD: "250"
    volumes:
      - supportops-data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  supportops-data:
